<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1240" viewBox="0 0 1400 1240" role="img" aria-label="Seven-step data analytics workflow"><rect width="1400" height="1240" rx="28" fill="#071725"/><g font-family="Arial, sans-serif"><text x="72" y="84" fill="#53e4e7" font-size="18" letter-spacing="3">FROM RAW DATA TO BUSINESS INSIGHTS</text><text x="72" y="143" fill="#f3f8fc" font-size="44" font-weight="700">The analytics workflow</text><text x="72" y="183" fill="#adc2d4" font-size="21">Seven steps. One clear path from a question to a shareable project.</text><path d="M112 316v40" stroke="#53e4e7" stroke-width="3"/><path d="m106 348 6 8 6-8" fill="none" stroke="#53e4e7" stroke-width="3"/><rect x="72" y="224" width="1256" height="110" rx="18" fill="#10283b" stroke="#24485e"/><circle cx="112" cy="279" r="23" fill="#53e4e7"/><text x="112" y="287" text-anchor="middle" fill="#071725" font-size="21" font-weight="700">01</text><rect x="162" y="247" width="66" height="64" rx="12" fill="#18394e"/><text x="195" y="287" text-anchor="middle" fill="#ffd557" font-size="21" font-weight="700">?</text><text x="254" y="269" fill="#f3f8fc" font-size="27" font-weight="700">Business question</text><text x="254" y="303" fill="#adc2d4" font-size="21">Define the problem and analysis goals.</text><path d="M112 448v40" stroke="#53e4e7" stroke-width="3"/><path d="m106 480 6 8 6-8" fill="none" stroke="#53e4e7" stroke-width="3"/><rect x="72" y="356" width="1256" height="110" rx="18" fill="#10283b" stroke="#24485e"/><circle cx="112" cy="411" r="23" fill="#53e4e7"/><text x="112" y="419" text-anchor="middle" fill="#071725" font-size="21" font-weight="700">02</text><rect x="162" y="379" width="66" height="64" rx="12" fill="#18394e"/><text x="195" y="419" text-anchor="middle" fill="#ffd557" font-size="21" font-weight="700">Py</text><text x="254" y="401" fill="#f3f8fc" font-size="27" font-weight="700">Python · Prepare &amp; explore</text><text x="254" y="435" fill="#adc2d4" font-size="21">Clean, transform, and inspect the data.</text><path d="M112 580v40" stroke="#53e4e7" stroke-width="3"/><path d="m106 612 6 8 6-8" fill="none" stroke="#53e4e7" stroke-width="3"/><rect x="72" y="488" width="1256" height="110" rx="18" fill="#10283b" stroke="#24485e"/><circle cx="112" cy="543" r="23" fill="#53e4e7"/><text x="112" y="551" text-anchor="middle" fill="#071725" font-size="21" font-weight="700">03</text><rect x="162" y="511" width="66" height="64" rx="12" fill="#18394e"/><text x="195" y="551" text-anchor="middle" fill="#ffd557" font-size="21" font-weight="700">SQL</text><text x="254" y="533" fill="#f3f8fc" font-size="27" font-weight="700">SQL · Analyze</text><text x="254" y="567" fill="#adc2d4" font-size="21">Load tables and answer business questions.</text><path d="M112 712v40" stroke="#53e4e7" stroke-width="3"/><path d="m106 744 6 8 6-8" fill="none" stroke="#53e4e7" stroke-width="3"/><rect x="72" y="620" width="1256" height="110" rx="18" fill="#10283b" stroke="#24485e"/><circle cx="112" cy="675" r="23" fill="#53e4e7"/><text x="112" y="683" text-anchor="middle" fill="#071725" font-size="21" font-weight="700">04</text><rect x="162" y="643" width="66" height="64" rx="12" fill="#18394e"/><text x="195" y="683" text-anchor="middle" fill="#ffd557" font-size="21" font-weight="700">BI</text><text x="254" y="665" fill="#f3f8fc" font-size="27" font-weight="700">Power BI · Visualize</text><text x="254" y="699" fill="#adc2d4" font-size="21">Build an interactive dashboard.</text><path d="M112 844v40" stroke="#53e4e7" stroke-width="3"/><path d="m106 876 6 8 6-8" fill="none" stroke="#53e4e7" stroke-width="3"/><rect x="72" y="752" width="1256" height="110" rx="18" fill="#10283b" stroke="#24485e"/><circle cx="112" cy="807" r="23" fill="#53e4e7"/><text x="112" y="815" text-anchor="middle" fill="#071725" font-size="21" font-weight="700">05</text><rect x="162" y="775" width="66" height="64" rx="12" fill="#18394e"/><text x="195" y="815" text-anchor="middle" fill="#ffd557" font-size="21" font-weight="700">DOC</text><text x="254" y="797" fill="#f3f8fc" font-size="27" font-weight="700">Project report</text><text x="254" y="831" fill="#adc2d4" font-size="21">Summarize findings and recommendations.</text><path d="M112 976v40" stroke="#53e4e7" stroke-width="3"/><path d="m106 1008 6 8 6-8" fill="none" stroke="#53e4e7" stroke-width="3"/><rect x="72" y="884" width="1256" height="110" rx="18" fill="#10283b" stroke="#24485e"/><circle cx="112" cy="939" r="23" fill="#53e4e7"/><text x="112" y="947" text-anchor="middle" fill="#071725" font-size="21" font-weight="700">06</text><rect x="162" y="907" width="66" height="64" rx="12" fill="#18394e"/><text x="195" y="947" text-anchor="middle" fill="#ffd557" font-size="21" font-weight="700">PPT</text><text x="254" y="929" fill="#f3f8fc" font-size="27" font-weight="700">Stakeholder presentation</text><text x="254" y="963" fill="#adc2d4" font-size="21">Communicate insights using Gamma AI.</text><rect x="72" y="1016" width="1256" height="110" rx="18" fill="#10283b" stroke="#24485e"/><circle cx="112" cy="1071" r="23" fill="#53e4e7"/><text x="112" y="1079" text-anchor="middle" fill="#071725" font-size="21" font-weight="700">07</text><rect x="162" y="1039" width="66" height="64" rx="12" fill="#18394e"/><text x="195" y="1079" text-anchor="middle" fill="#ffd557" font-size="21" font-weight="700">Git</text><text x="254" y="1061" fill="#f3f8fc" font-size="27" font-weight="700">GitHub · Publish</text><text x="254" y="1095" fill="#adc2d4" font-size="21">Organize and share project files.</text><text x="72" y="1206" fill="#7d9bb0" font-size="17">CUSTOMER SHOPPING BEHAVIOR ANALYSIS</text><text x="1328" y="1206" text-anchor="end" fill="#53e4e7" font-size="17">AkashQuants</text></g></svg>